# ===== ADD-ON: NetAlertX attached to an existing customer's VPN container =====
# Fill ONLY 1 variable in Coolify UI:
#   TENANT_ID    custom1    (same TENANT_ID as the existing customer)
services:
  netalertx:
    image: jokobsk/netalertx:latest
    restart: unless-stopped
    network_mode: "container:vpn-nccnckqtlnmh7e8jhb3dhye8-20261119T161350"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      - TZ=Asia/Aden
      - PORT=20211
      - LISTEN_ADDR=0.0.0.0
    volumes:
      - netalertx-config:/data/config
      - netalertx-db:/data/db

volumes:
  netalertx-config:
  netalertx-db: